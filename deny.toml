# cargo-deny: licenses, advisories and sources. Only AGPL-compatible licenses are allowed.

[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"

[licenses]
version = 2
allow = [
  "AGPL-3.0-or-later",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "BSL-1.0",
  # RustyPipe (YouTube connector). AGPL-3.0 §13 and GPL-3.0 §13 allow combining both in one
  # binary, distributed under the terms of both.
  "GPL-3.0-only",
  "CDLA-Permissive-2.0",
  "ISC",
  "LGPL-2.1-or-later",
  "LGPL-3.0-only",
  "LGPL-3.0-or-later",
  "MIT",
  "MPL-2.0",
  "Unicode-3.0",
  "Zlib",
]
confidence-threshold = 0.9

# RustyPipe (and its deobfuscator crate) declare the deprecated SPDX id "GPL-3.0", which means
# GPL-3.0-only; the repository's LICENSE is the plain GPL-3.0 text, with no "or later" notice.
[[licenses.clarify]]
crate = "rustypipe"
expression = "GPL-3.0-only"
license-files = []

[[licenses.clarify]]
crate = "rustypipe-deobfuscator"
expression = "GPL-3.0-only"
license-files = []

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-git = [
  "https://github.com/flaneur-app/core",
  "https://github.com/flaneur-app/connector-youtube",
  "https://github.com/flaneur-app/connector-odysee",
  "https://github.com/flaneur-app/connector-rss",
  # RustyPipe, pinned by revision in the YouTube connector until a release has its fixes.
  "https://codeberg.org/ThetaDev/rustypipe",
]
