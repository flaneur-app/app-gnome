name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rust:
    uses: flaneur-app/.github/.github/workflows/rust-ci.yml@main
    with:
      system-packages: "libgtk-4-dev libadwaita-1-dev libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev libsqlite3-dev"
