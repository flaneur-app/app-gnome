# SPDX-License-Identifier: AGPL-3.0-or-later

[package]
name = "flaneur"
description = "Flâneur for GNOME: a fast, open, multi-service video client."
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-or-later"
repository = "https://github.com/flaneur-app/app-gnome"
homepage = "https://flaneur.baxyz.dev"
rust-version = "1.100"
publish = false

[features]
# A built-in fake service with a few items, to exercise the video grid before real connectors.
demo = ["dep:async-trait"]

[dependencies]
async-trait = { version = "0.1.92", optional = true }
flaneur-model = { git = "https://github.com/flaneur-app/core" }
flaneur-connector = { git = "https://github.com/flaneur-app/core" }
flaneur-vm = { git = "https://github.com/flaneur-app/core" }
flaneur-store = { git = "https://github.com/flaneur-app/core" }
flaneur-connector-youtube = { git = "https://github.com/flaneur-app/connector-youtube" }
flaneur-connector-odysee = { git = "https://github.com/flaneur-app/connector-odysee" }
flaneur-connector-rss = { git = "https://github.com/flaneur-app/connector-rss" }

# Native builds target GTK 4.18 and libadwaita 1.7 (Debian trixie); the Flatpak runtime is newer.
adw = { package = "libadwaita", version = "0.9.2", features = ["v1_7"] }
gtk = { package = "gtk4", version = "0.11.5", features = ["v4_18"] }
gst = { package = "gstreamer", version = "0.25.4", features = ["v1_24"] }
# Thumbnails: decoded and scaled off the GTK thread; WebP is what Odysee's CDN serves.
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "webp"] }
futures-util = { version = "0.3.34", default-features = false, features = ["alloc"] }
# Thumbnails. TLS is rustls with the process-wide provider installed by main.rs.
reqwest = { version = "0.13.5", default-features = false, features = ["rustls-no-provider", "http2"] }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
serde_json = "1.0"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "sync", "time", "net", "io-util"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
url = "2.5.9"

[dev-dependencies]
async-trait = "0.1.92"

[build-dependencies]
glib-build-tools = "0.22"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
